services:
  - type: worker
    name: descobuddy
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ACCOUNT_NO
        sync: false
      - key: CHAT_ID
        sync: false
      - key: LOW_BALANCE_LIMIT
        value: "100"
